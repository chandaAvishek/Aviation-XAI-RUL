[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aviation-xai-rul"
version = "0.1.0"
description = "Remaining useful life (RUL) models and XAI utilities for aviation datasets"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.25.0",
  "pandas>=2.1.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.12.2",
  "scikit-learn>=1.3.0",
  "shap>=0.42.0",
  "xgboost>=1.8.0",
  "scipy>=1.11.0",
  "jupyter>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "black",
  "isort",
  "flake8",
  "pytest",
  "pytest-cov",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
